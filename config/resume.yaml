      aerospaziale ed energetico. Segue il ciclo dall'analisi dei requisiti alla progettazione, delivery e troubleshooting
      in produzione, con ownership su aree backend Java, microservizi, integrazioni e cloud delivery. Contribuisce a decisioni
      architetturali, qualità del software, mentoring tecnico e scelte pragmatiche orientate al prodotto.
